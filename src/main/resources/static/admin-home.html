<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard — Sales Savvy</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-bg-grid">

  <header class="site-nav site-nav--admin">
    <a class="site-nav__brand" href="/admin-home.html">
      <span class="site-nav__mark" aria-hidden="true"></span>
      Sales Savvy <span class="admin-badge">Admin</span>
    </a>
    <nav aria-label="Primary">
      <ul class="site-nav__links">
        <li><a href="/all-products-admin.html">All Products</a></li>
        <li><a href="/add-product.html">Add Product</a></li>
      </ul>
    </nav>
    <div class="site-nav__actions">
      <span class="site-nav__icon-btn" id="welcomeText"></span>
      <button type="button" class="btn btn--ghost btn--small" onclick="logout()">Log out</button>
    </div>
  </header>

  <main class="app-main">
    <div class="page-hero">
      <h1>Dashboard</h1>
      <p>Manage your catalog and monitor the store.</p>
    </div>

    <div class="admin-card-grid">
      <a href="/all-products-admin.html" class="admin-dash-card">
        <div class="admin-dash-card__icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </div>
        <h3>All Products</h3>
        <p>View, edit and delete catalog items</p>
      </a>
      <a href="/add-product.html" class="admin-dash-card">
        <div class="admin-dash-card__icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
        </div>
        <h3>Add Product</h3>
        <p>Create a new product in the catalog</p>
      </a>
      <div class="admin-dash-card admin-dash-card--action" onclick="loadAdminData()">
        <div class="admin-dash-card__icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        </div>
        <h3>API Test</h3>
        <p>Ping the admin API endpoint</p>
      </div>
    </div>

    <div id="apiResult" class="api-result"></div>
  </main>

  <footer class="site-footer">
    <span>© Sales Savvy Admin</span>
    <a href="/index.html">Marketing home</a>
  </footer>

  <script src="/js/admin.js"></script>
</body>
</html>
