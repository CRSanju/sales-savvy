<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Product — Sales Savvy Admin</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-bg-grid">

  <header class="site-nav site-nav--admin">
    <a class="site-nav__brand" href="/admin-home.html">
      <span class="site-nav__mark" aria-hidden="true"></span>
      Sales Savvy <span class="admin-badge">Admin</span>
    </a>
    <nav aria-label="Primary">
      <ul class="site-nav__links">
        <li><a href="/all-products-admin.html">All Products</a></li>
        <li><a href="/add-product.html">Add Product</a></li>
      </ul>
    </nav>
    <div class="site-nav__actions">
      <button type="button" class="btn btn--ghost btn--small" onclick="window.location.href='/all-products-admin.html'">← Back</button>
    </div>
  </header>

  <main class="app-main">
    <div class="page-hero">
      <h1>Add Product</h1>
      <p>Fill in the details to add a new item to the catalog.</p>
    </div>

    <div class="admin-form-card">
      <form id="addProductForm">
        <div class="field-group">
          <label for="name">Product Name</label>
          <input class="field-line" type="text" id="name" placeholder="e.g. Sony WH-1000XM5" required />
        </div>
        <div class="field-group">
          <label for="description">Description</label>
          <input class="field-line" type="text" id="description" placeholder="Short product description" required />
        </div>
        <div class="admin-form-row">
          <div class="field-group">
            <label for="price">Price (₹)</label>
            <input class="field-line" type="number" id="price" step="0.01" placeholder="0.00" required />
          </div>
          <div class="field-group">
            <label for="stock">Stock</label>
            <input class="field-line" type="number" id="stock" placeholder="0" required />
          </div>
        </div>
        <div class="field-group">
          <label for="category">Category</label>
          <input class="field-line" type="text" id="category" placeholder="e.g. Headphones" required />
        </div>
        <div class="field-group">
          <label for="imageUrl">Image URL</label>
          <input class="field-line" type="text" id="imageUrl" placeholder="https://..." />
        </div>
        <button class="btn btn--accent" type="submit">Add Product</button>
      </form>
      <p id="message" class="msg" role="status"></p>
    </div>
  </main>

  <footer class="site-footer">
    <span>© Sales Savvy Admin</span>
    <a href="/admin-home.html">Dashboard</a>
  </footer>

  <script src="/js/admin-products.js"></script>
</body>
</html>
