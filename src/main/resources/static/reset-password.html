<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — Sales Savvy</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-visual">
      <div class="auth-visual__caption">
        <h2>New password</h2>
        <p>Choose a strong password you have not used elsewhere.</p>
      </div>
    </div>
    <div class="auth-panel">
      <div class="auth-card">
        <h1>Reset password</h1>
        <p class="lead">Enter your new password below.</p>

        <div id="formSection">
          <div class="field-group">
            <label for="newPassword">New password</label>
            <input class="field-line" type="password" id="newPassword" placeholder="At least 6 characters" minlength="6" required />
          </div>
          <div class="field-group">
            <label for="confirmPassword">Confirm</label>
            <input class="field-line" type="password" id="confirmPassword" placeholder="Repeat password" required />
          </div>
          <button type="button" id="submitBtn" class="btn btn--accent" onclick="resetPassword()">Reset password</button>
        </div>

        <p id="message" class="msg" role="status"></p>
        <div class="auth-links">
          <a href="/login.html" id="backLink">← Back to login</a>
        </div>
      </div>
    </div>
  </div>
  <script>
    const token = new URLSearchParams(window.location.search).get("token");

    if (!token) {
      document.getElementById("formSection").innerHTML =
        '<p class="msg msg--err" style="text-align:left">Invalid or missing reset link. Please request a new one from the forgot password page.</p>';
    }

    async function resetPassword() {
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const messageEl = document.getElementById("message");
      const btn = document.getElementById("submitBtn");

      if (!token) return;

      if (newPassword.length < 6) {
        messageEl.textContent = "Password must be at least 6 characters.";
        messageEl.className = "msg msg--err";
        return;
      }

      if (newPassword !== confirmPassword) {
        messageEl.textContent = "Passwords do not match.";
        messageEl.className = "msg msg--err";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Resetting…";

      try {
        const res = await fetch("/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json();
        messageEl.textContent = data.message;

        if (res.ok) {
          messageEl.className = "msg msg--ok";
          document.getElementById("formSection").style.display = "none";
          setTimeout(() => (window.location.href = "/login.html"), 2000);
        } else {
          messageEl.className = "msg msg--err";
          btn.disabled = false;
          btn.textContent = "Reset password";
        }
      } catch (err) {
        messageEl.textContent = "Something went wrong. Please try again.";
        messageEl.className = "msg msg--err";
        btn.disabled = false;
        btn.textContent = "Reset password";
      }
    }
  </script>
</body>
</html>
