<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password — Sales Savvy</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-visual">
      <div class="auth-visual__caption">
        <h2>Reset access</h2>
        <p>We will email you a secure link to set a new password.</p>
      </div>
    </div>
    <div class="auth-panel">
      <div class="auth-card">
        <h1>Forgot password</h1>
        <p class="lead">Enter the email linked to your Sales Savvy account.</p>
        <div class="field-group">
          <label for="email">Email</label>
          <input class="field-line" type="email" id="email" placeholder="you@example.com" required />
        </div>
        <button type="button" class="btn btn--accent" onclick="sendResetLink()">Send reset link</button>
        <p id="message" class="msg" role="status"></p>
        <div class="auth-links">
          <a href="/login.html">← Back to login</a>
          <a href="/index.html">Home</a>
        </div>
      </div>
    </div>
  </div>
  <script>
    async function sendResetLink() {
      const email = document.getElementById("email").value.trim();
      const messageEl = document.getElementById("message");

      if (!email) {
        messageEl.textContent = "Please enter your email.";
        messageEl.className = "msg msg--err";
        return;
      }

      try {
        const res = await fetch("/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        messageEl.textContent = data.message;
        messageEl.className = res.ok ? "msg msg--ok" : "msg msg--err";
      } catch (err) {
        messageEl.textContent = "Something went wrong. Please try again.";
        messageEl.className = "msg msg--err";
      }
    }
  </script>
</body>
</html>
