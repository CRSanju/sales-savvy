<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — Sales Savvy</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-visual">
      <div class="auth-visual__caption">
        <h2>Welcome back</h2>
        <p>Sign in to browse the catalog, manage your bag, and complete delivery checkout.</p>
      </div>
    </div>
    <div class="auth-panel">
      <div class="auth-card">
        <h1>Log in</h1>
        <p class="lead">Use your customer credentials to continue.</p>
        <form id="loginForm">
          <div class="field-group">
            <label for="username">Username</label>
            <input class="field-line" type="text" id="username" name="username" placeholder="Your username" autocomplete="username" required />
          </div>
          <div class="field-group">
            <label for="password">Password</label>
            <input class="field-line" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
          </div>
          <button class="btn btn--accent" type="submit">Log in</button>
        </form>
        <p id="message" class="msg" role="status"></p>
        <div class="auth-links">
          <a href="/forgot-password.html">Forgot password?</a>
          <a href="/signup.html">New here? Create an account</a>
          <a href="/index.html">← Back to home</a>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
