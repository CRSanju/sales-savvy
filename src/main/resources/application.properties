spring.application.name=JWTDemo

# Serve static files from src first
spring.web.resources.static-locations=file:./src/main/resources/static/,classpath:/static/

# Disable cache during development
spring.web.resources.cache.period=0

# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
app.jwt.secret=YOUR_SECRET
app.jwt.expiration-ms=3600000

# Razorpay Configuration
razorpay.key-id=YOUR_KEY
razorpay.key-secret=YOUR_SECRET
razorpay.currency=INR

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Base URL
app.base-url=${APP_BASE_URL}

server.port=${PORT:8080}
