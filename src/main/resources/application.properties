
spring.application.name=JWTDemo

# Serve static files from src first (avoids stale UI in target/classes). Falls back to classpath.
spring.web.resources.static-locations=file:./src/main/resources/static/,classpath:/static/

# Local dev: reduce browser caching of CSS/JS during iteration
spring.web.resources.cache.period=0

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

